<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#1e3a5f">
  <title>🗳️ Election Assistant – Google Gemini AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f0f4fa 0%, #e6edf4 100%);
      padding: 20px;
      min-height: 100vh;
      transition: background 0.3s, color 0.2s;
    }
    body.dark { background: #0a0c10; color: #e0e0e0; }
    .skip-link {
      position: absolute; top: -40px; left: 0;
      background: #1e3a5f; color: white; padding: 8px 12px;
      z-index: 100; text-decoration: none; border-radius: 0 0 8px 0;
    }
    .skip-link:focus { top: 0; }
    *:focus { outline: 2px solid #ffc107; outline-offset: 2px; }
    .container { max-width: 1300px; margin: 0 auto; }
    .hero {
      background: #1e3a5f; color: white; border-radius: 32px;
      padding: 1.5rem 2rem; margin-bottom: 2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    }
    body.dark .hero { background: #0f2b40; }
    h1 { font-size: 1.8rem; }
    .controls { display: flex; gap: 8px; }
    .ctrl-btn {
      background: rgba(255,255,255,0.2); border: none; padding: 6px 12px;
      border-radius: 40px; color: white; cursor: pointer; font-weight: 500;
      transition: 0.2s;
    }
    .ctrl-btn.active, .ctrl-btn:hover { background: #ffc107; color: #1e3a5f; }
    .dashboard { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 24px; }
    .card {
      background: white; border-radius: 28px; flex: 1; min-width: 280px;
      overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    body.dark .card { background: #1e1e2a; border: 1px solid #2c2c3a; }
    .card-header {
      background: #f8fafc; padding: 1rem 1.5rem; font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
    }
    body.dark .card-header { background: #252533; border-bottom-color: #3a3a4a; }
    .card-content { padding: 1.5rem; }
    input, select, button { font-family: inherit; }
    #addressInput {
      width: 100%; padding: 12px 16px; border-radius: 48px;
      border: 1px solid #cbd5e1; margin-bottom: 12px; outline: none;
      background: white;
    }
    body.dark #addressInput { background: #2c2c3a; border-color: #4a4a5a; color: white; }
    button {
      background: #2c7da0; color: white; border: none; padding: 10px 20px;
      border-radius: 48px; cursor: pointer; font-weight: 600; width: 100%;
      margin-bottom: 8px; transition: 0.2s;
    }
    button:hover { background: #1f5e7a; transform: scale(0.98); }
    .polling-map iframe { width: 100%; height: 200px; border-radius: 20px; margin-top: 12px; }
    .timeline-step {
      border-left: 3px solid #2c7da0; padding: 0.8rem 1rem;
      margin-bottom: 1rem; background: #f9fdfe; border-radius: 16px;
    }
    body.dark .timeline-step { background: #252533; }
    .step-title { font-weight: 700; }
    .timeline-day { font-size: 0.8rem; color: #2c7da0; }
    .role-selector {
      background: white; padding: 1rem 1.5rem; border-radius: 28px;
      margin-bottom: 24px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    body.dark .role-selector { background: #1e1e2a; }
    #roleSelect {
      padding: 8px 16px; border-radius: 40px; border: 1px solid #cbd5e1;
      background: white;
    }
    body.dark #roleSelect { background: #2c2c3a; color: white; border-color: #4a4a5a; }
    .chat-area { background: white; border-radius: 28px; overflow: hidden; }
    body.dark .chat-area { background: #1e1e2a; }
    .chat-messages {
      height: 360px; overflow-y: auto; padding: 1rem;
      background: #fefcf5;
    }
    body.dark .chat-messages { background: #15151f; }
    .message { display: flex; margin-bottom: 12px; }
    .user { justify-content: flex-end; }
    .assistant { justify-content: flex-start; }
    .bubble {
      max-width: 80%; padding: 10px 16px; border-radius: 20px;
      font-size: 0.95rem; line-height: 1.4; word-wrap: break-word;
    }
    .user .bubble { background: #1e3a5f; color: white; border-radius: 20px 20px 8px 20px; }
    .assistant .bubble { background: #e9ecef; color: #1e2a3a; border-radius: 20px 20px 20px 8px; }
    body.dark .assistant .bubble { background: #2c2c3a; color: #e0e0e0; }
    body.dark .user .bubble { background: #0a4c6e; }
    .quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 1rem; border-top: 1px solid #e2e8f0; }
    .quick-btn {
      background: #eef2ff; color: #1e3a5f; width: auto; padding: 6px 14px;
      margin: 0; font-size: 0.8rem;
    }
    body.dark .quick-btn { background: #2c3e50; color: #ddd; }
    .input-area { display: flex; padding: 1rem; gap: 12px; border-top: 1px solid #e2e8f0; }
    #userInput { flex: 1; padding: 12px 16px; border-radius: 48px; border: 1px solid #cbd5e1; outline: none; background: white; }
    body.dark #userInput { background: #2c2c3a; border-color: #4a4a5a; color: white; }
    footer { text-align: center; margin-top: 24px; font-size: 0.75rem; color: #4a5b6e; }
    @media (max-width: 700px) { .hero { flex-direction: column; align-items: flex-start; } .bubble { max-width: 90%; } }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="container">
  <div class="hero">
    <h1>🗳️ Election Assistant (Gemini AI)</h1>
    <div class="controls">
      <button id="langEnBtn" class="ctrl-btn active" aria-label="English">🇬🇧 EN</button>
      <button id="langHiBtn" class="ctrl-btn" aria-label="हिंदी">🇮🇳 हिंदी</button>
      <button id="darkModeBtn" class="ctrl-btn" aria-label="Dark mode">🌓 Dark</button>
      <button id="speechBtn" class="ctrl-btn" aria-label="Speech input">🎤 Speak</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="card-header">📍 Polling Place</div>
      <div class="card-content">
        <input type="text" id="addressInput" placeholder="Enter address (e.g., New Delhi, India)" autocomplete="off" aria-label="Your address">
        <button id="findPollingBtn" aria-label="Show map">🔍 Show Map</button>
        <div id="mapContainer" class="polling-map"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">📅 Election Countdown</div>
      <div class="card-content" id="countdownContainer" aria-live="polite">Loading...</div>
      <div class="card-footer" style="padding: 0 1.5rem 1.5rem">
        <button id="downloadPdfBtn" aria-label="Download PDF guide">📘 Download Voter Guide (PDF)</button>
      </div>
    </div>
  </div>

  <div class="role-selector">
    <label id="roleLabel" aria-label="Select your role">I am a:</label>
    <select id="roleSelect" aria-label="Role">
      <option value="voter">Voter</option>
      <option value="candidate">Candidate</option>
      <option value="official">Election Official</option>
    </select>
  </div>

  <div class="chat-area" id="main-content" tabindex="-1" role="region" aria-label="AI chat">
    <div class="card-header">💬 AI Assistant (Google Gemini)</div>
    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
      <div class="message assistant"><div class="bubble">Hello! I'm powered by Google Gemini. Select your role and ask me anything about elections.</div></div>
    </div>
    <div class="quick-buttons" id="quickButtons"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off" aria-label="Your question">
      <button id="sendBtn" aria-label="Send">Send</button>
    </div>
  </div>
  <footer>Google Gemini AI | Google Maps | Secure & Accessible</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // DOM elements
  const chatDiv = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const roleSelect = document.getElementById('roleSelect');
  const addressInput = document.getElementById('addressInput');
  const findPollingBtn = document.getElementById('findPollingBtn');
  const mapContainer = document.getElementById('mapContainer');
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');
  const langEnBtn = document.getElementById('langEnBtn');
  const langHiBtn = document.getElementById('langHiBtn');
  const darkModeBtn = document.getElementById('darkModeBtn');
  const speechBtn = document.getElementById('speechBtn');
  const countdownDiv = document.getElementById('countdownContainer');

  let currentLang = 'en';
  let currentRole = 'voter';
  let dark = false;
  let typingIndicator = null;

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'assistant'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function showTyping() {
    if (typingIndicator) return;
    typingIndicator = document.createElement('div');
    typingIndicator.className = 'message assistant typing';
    typingIndicator.innerHTML = '<div class="bubble">⏳ Thinking...</div>';
    chatDiv.appendChild(typingIndicator);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function hideTyping() {
    if (typingIndicator) { typingIndicator.remove(); typingIndicator = null; }
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessage(text, true);
    userInput.value = '';
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, role: currentRole })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || data.error || 'No response', false);
    } catch (err) {
      hideTyping();
      addMessage('⚠️ Connection error. Try again.', false);
    }
  }

  function initQuickButtons() {
    const container = document.getElementById('quickButtons');
    const qs = ['How to register to vote?', 'What is Model Code of Conduct?', 'How do I file nomination?', 'What ID do I need?'];
    container.innerHTML = '';
    qs.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = q;
      btn.setAttribute('aria-label', q);
      btn.onclick = () => { userInput.value = q; sendMessage(q); };
      container.appendChild(btn);
    });
  }

  function updateCountdown() {
    const elections = [
      { name: 'General Election 2026', dateStr: '2026-11-03' },
      { name: 'State Elections', dateStr: '2026-08-15' }
    ];
    const today = new Date();
    const html = elections.map(e => {
      const target = new Date(e.dateStr);
      const diff = Math.ceil((target - today) / (1000*3600*24));
      const status = diff < 0 ? '✅ Completed' : diff === 0 ? '🔴 TODAY' : `⏳ in ${diff} days`;
      return `<div class="timeline-step"><div class="step-title">${e.name}</div><div class="timeline-day">${status}</div><div>${e.dateStr}</div></div>`;
    }).join('');
    countdownDiv.innerHTML = html;
  }
  setInterval(updateCountdown, 86400000);
  updateCountdown();

  findPollingBtn.onclick = () => {
    const addr = addressInput.value.trim();
    if (!addr) return;
    mapContainer.innerHTML = `<iframe width="100%" height="200" style="border:0" loading="lazy" allowfullscreen src="https://maps.google.com/maps?q=${encodeURIComponent(addr)}&output=embed" title="Map near ${addr}"></iframe>`;
  };

  downloadPdfBtn.onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica');
    doc.setFontSize(20);
    doc.text('Election Voter Guide', 20, 20);
    doc.setFontSize(12);
    doc.text('How to register to vote:', 20, 40);
    doc.text('1. Visit local election commission website', 25, 50);
    doc.text('2. Fill out registration form', 25, 60);
    doc.text('3. Submit proof of address and identity', 25, 70);
    doc.text('Polling day essentials:', 20, 90);
    doc.text('- Voter ID / government ID', 25, 100);
    doc.text('- Polling slip (if received)', 25, 110);
    doc.text('Model Code of Conduct:', 20, 130);
    doc.text('- No hate speech, bribery, or misuse of power', 25, 140);
    doc.save('voter_guide.pdf');
  };

  function initSpeech() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('Speech not supported');
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = currentLang === 'en' ? 'en-US' : 'hi-IN';
    recognition.interimResults = false;
    recognition.start();
    speechBtn.textContent = '🎙️ Listening...';
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      userInput.value = transcript;
      sendMessage(transcript);
      speechBtn.textContent = '🎤 Speak';
    };
    recognition.onerror = () => { speechBtn.textContent = '🎤 Speak'; alert('Speech error'); };
    recognition.onend = () => { speechBtn.textContent = '🎤 Speak'; };
  }
  if (speechBtn) speechBtn.onclick = initSpeech;

  function toggleDarkMode() {
    dark = !dark;
    document.body.classList.toggle('dark', dark);
    darkModeBtn.textContent = dark ? '☀️ Light' : '🌓 Dark';
    localStorage.setItem('election_dark', dark ? 'dark' : 'light');
  }
  darkModeBtn.onclick = toggleDarkMode;

  const translations = {
    en: {
      h1: '🗳️ Election Assistant (Gemini AI)',
      findHeader: '📍 Polling Place', addressPlaceholder: 'Enter address (e.g., New Delhi)',
      findBtn: '🔍 Show Map', countdownHeader: '📅 Election Countdown',
      pdfBtn: '📘 Download Voter Guide (PDF)', roleLabel: 'I am a:',
      voter: 'Voter', candidate: 'Candidate', official: 'Election Official',
      chatHeader: '💬 AI Assistant (Google Gemini)', inputPlaceholder: 'Type your question...',
      sendBtn: 'Send', welcome: 'Hello! I am powered by Google Gemini. Ask me anything about elections.'
    },
    hi: {
      h1: '🗳️ चुनाव सहायक (Gemini AI)',
      findHeader: '📍 मतदान केंद्र', addressPlaceholder: 'पता दर्ज करें (जैसे, नई दिल्ली)',
      findBtn: '🔍 मानचित्र दिखाएँ', countdownHeader: '📅 चुनाव उल्टी गिनती',
      pdfBtn: '📘 मतदाता गाइड डाउनलोड करें (PDF)', roleLabel: 'मैं हूँ:',
      voter: 'मतदाता', candidate: 'उम्मीदवार', official: 'चुनाव अधिकारी',
      chatHeader: '💬 AI सहायक (Google Gemini)', inputPlaceholder: 'अपना प्रश्न लिखें...',
      sendBtn: 'भेजें', welcome: 'नमस्ते! मैं Google Gemini द्वारा संचालित हूँ। चुनावों के बारे में कुछ भी पूछें।'
    }
  };

  function setLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    document.querySelector('h1').innerText = t.h1;
    document.querySelectorAll('.card-header')[0].innerText = t.findHeader;
    addressInput.placeholder = t.addressPlaceholder;
    findPollingBtn.innerText = t.findBtn;
    document.querySelectorAll('.card-header')[1].innerText = t.countdownHeader;
    downloadPdfBtn.innerText = t.pdfBtn;
    document.getElementById('roleLabel').innerText = t.roleLabel;
    roleSelect.options[0].text = t.voter;
    roleSelect.options[1].text = t.candidate;
    roleSelect.options[2].text = t.official;
    document.querySelectorAll('.card-header')[2].innerText = t.chatHeader;
    userInput.placeholder = t.inputPlaceholder;
    sendBtn.innerText = t.sendBtn;
    const firstMsg = document.querySelector('.message.assistant .bubble');
    if (firstMsg) firstMsg.innerText = t.welcome;
    langEnBtn.classList.toggle('active', lang === 'en');
    langHiBtn.classList.toggle('active', lang === 'hi');
    localStorage.setItem('election_lang', lang);
  }

  langEnBtn.onclick = () => setLanguage('en');
  langHiBtn.onclick = () => setLanguage('hi');

  roleSelect.onchange = (e) => { currentRole = e.target.value; localStorage.setItem('election_role', currentRole); };
  sendBtn.onclick = () => sendMessage(userInput.value);
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(userInput.value); });

  // Load saved preferences
  const savedLang = localStorage.getItem('election_lang');
  if (savedLang === 'hi') setLanguage('hi');
  else setLanguage('en');
  const savedRole = localStorage.getItem('election_role');
  if (savedRole && ['voter', 'candidate', 'official'].includes(savedRole)) {
    currentRole = savedRole;
    roleSelect.value = savedRole;
  }
  if (localStorage.getItem('election_dark') === 'dark') toggleDarkMode();

  initQuickButtons();
  updateCountdown();
</script>
</body>
</html>
