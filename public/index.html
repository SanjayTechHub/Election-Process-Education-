<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#1e3a5f">
  <title>🗳️ Pro Election Assistant | AI + Maps + Speech + PDF</title>
  <!-- Google Fonts (free) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f0f4fa 0%, #e6edf4 100%);
      padding: 20px;
      min-height: 100vh;
      transition: background 0.3s, color 0.2s;
    }
    body.dark {
      background: #0a0c10;
      color: #e0e0e0;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    /* Header */
    .hero {
      background: #1e3a5f;
      color: white;
      border-radius: 32px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    body.dark .hero {
      background: #0f2b40;
    }
    h1 {
      font-size: 1.8rem;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 6px 12px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    .ctrl-btn.active {
      background: #ffc107;
      color: #1e3a5f;
    }
    .ctrl-btn:hover {
      background: #ffc107;
      color: #1e3a5f;
    }
    /* Dashboard cards */
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 28px;
      flex: 1;
      min-width: 280px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      transition: background 0.2s;
    }
    body.dark .card {
      background: #1e1e2a;
      border: 1px solid #2c2c3a;
    }
    .card-header {
      background: #f8fafc;
      padding: 1rem 1.5rem;
      font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
    }
    body.dark .card-header {
      background: #252533;
      border-bottom-color: #3a3a4a;
    }
    .card-content {
      padding: 1.5rem;
    }
    /* Inputs & buttons */
    input, select, button {
      font-family: inherit;
    }
    #addressInput {
      width: 100%;
      padding: 12px 16px;
      border-radius: 48px;
      border: 1px solid #cbd5e1;
      margin-bottom: 12px;
      outline: none;
      background: white;
    }
    body.dark #addressInput {
      background: #2c2c3a;
      border-color: #4a4a5a;
      color: white;
    }
    button {
      background: #2c7da0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 48px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-bottom: 8px;
      transition: 0.2s;
    }
    button:hover {
      background: #1f5e7a;
      transform: scale(0.98);
    }
    .polling-map iframe {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      margin-top: 12px;
    }
    .timeline-step {
      border-left: 3px solid #2c7da0;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      background: #f9fdfe;
      border-radius: 16px;
    }
    body.dark .timeline-step {
      background: #252533;
    }
    .step-title {
      font-weight: 700;
    }
    .timeline-day {
      font-size: 0.8rem;
      color: #2c7da0;
    }
    /* Role selector */
    .role-selector {
      background: white;
      padding: 1rem 1.5rem;
      border-radius: 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    body.dark .role-selector {
      background: #1e1e2a;
    }
    #roleSelect {
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
      background: white;
    }
    body.dark #roleSelect {
      background: #2c2c3a;
      color: white;
      border-color: #4a4a5a;
    }
    /* Chat area */
    .chat-area {
      background: white;
      border-radius: 28px;
      overflow: hidden;
    }
    body.dark .chat-area {
      background: #1e1e2a;
    }
    .chat-messages {
      height: 360px;
      overflow-y: auto;
      padding: 1rem;
      background: #fefcf5;
    }
    body.dark .chat-messages {
      background: #15151f;
    }
    .message {
      display: flex;
      margin-bottom: 12px;
    }
    .user {
      justify-content: flex-end;
    }
    .assistant {
      justify-content: flex-start;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user .bubble {
      background: #1e3a5f;
      color: white;
      border-radius: 20px 20px 8px 20px;
    }
    .assistant .bubble {
      background: #e9ecef;
      color: #1e2a3a;
      border-radius: 20px 20px 20px 8px;
    }
    body.dark .assistant .bubble {
      background: #2c2c3a;
      color: #e0e0e0;
    }
    body.dark .user .bubble {
      background: #0a4c6e;
    }
    .typing .bubble {
      background: #e2e8f0;
      color: #4a5568;
      font-style: italic;
    }
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 1rem;
      border-top: 1px solid #e2e8f0;
    }
    .quick-btn {
      background: #eef2ff;
      color: #1e3a5f;
      width: auto;
      padding: 6px 14px;
      margin: 0;
      font-size: 0.8rem;
    }
    body.dark .quick-btn {
      background: #2c3e50;
      color: #ddd;
    }
    .input-area {
      display: flex;
      padding: 1rem;
      gap: 12px;
      border-top: 1px solid #e2e8f0;
    }
    #userInput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 48px;
      border: 1px solid #cbd5e1;
      outline: none;
      background: white;
    }
    body.dark #userInput {
      background: #2c2c3a;
      border-color: #4a4a5a;
      color: white;
    }
    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #4a5b6e;
    }
    @media (max-width: 700px) {
      .hero { flex-direction: column; align-items: flex-start; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>🗳️ Pro Election Assistant</h1>
    <div class="controls">
      <button id="langEnBtn" class="ctrl-btn active">🇬🇧 EN</button>
      <button id="langHiBtn" class="ctrl-btn">🇮🇳 हिंदी</button>
      <button id="darkModeBtn" class="ctrl-btn">🌓 Dark</button>
      <button id="speechBtn" class="ctrl-btn">🎤 Speak</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="card-header">📍 Find Polling Place</div>
      <div class="card-content">
        <input type="text" id="addressInput" placeholder="Enter address (e.g., New Delhi, India)" autocomplete="off">
        <button id="findPollingBtn">🔍 Show Map</button>
        <div id="mapContainer" class="polling-map"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">📅 Election Countdown & Guide</div>
      <div class="card-content" id="countdownContainer">Loading...</div>
      <div class="card-footer" style="padding: 0 1.5rem 1.5rem">
        <button id="downloadPdfBtn">📘 Download Voter Guide (PDF)</button>
      </div>
    </div>
  </div>

  <div class="role-selector">
    <label id="roleLabel">I am a:</label>
    <select id="roleSelect">
      <option value="voter">Voter</option>
      <option value="candidate">Candidate</option>
      <option value="official">Election Official</option>
    </select>
  </div>

  <div class="chat-area">
    <div class="card-header">💬 AI Assistant (Groq Llama 3.3)</div>
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant"><div class="bubble">Hello! Select your role and ask me anything about elections. I can help with voter registration, polling day, nomination, and more.</div></div>
    </div>
    <div class="quick-buttons" id="quickButtons"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
  <footer>Powered by Groq AI | Google Maps | Free & Open</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // ---------- DOM Elements ----------
  const chatDiv = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const roleSelect = document.getElementById('roleSelect');
  const addressInput = document.getElementById('addressInput');
  const findPollingBtn = document.getElementById('findPollingBtn');
  const mapContainer = document.getElementById('mapContainer');
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');
  const langEnBtn = document.getElementById('langEnBtn');
  const langHiBtn = document.getElementById('langHiBtn');
  const darkModeBtn = document.getElementById('darkModeBtn');
  const speechBtn = document.getElementById('speechBtn');
  const countdownDiv = document.getElementById('countdownContainer');

  // ---------- State ----------
  let currentLang = 'en';
  let currentRole = 'voter';
  let darkMode = false;
  let speechRecognition = null;
  let typingIndicator = null;

  // ---------- Helper: add message with optional typing ----------
  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'assistant'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function showTyping() {
    if (typingIndicator) return;
    typingIndicator = document.createElement('div');
    typingIndicator.className = 'message assistant typing';
    typingIndicator.innerHTML = '<div class="bubble">⏳ Thinking...</div>';
    chatDiv.appendChild(typingIndicator);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function hideTyping() {
    if (typingIndicator) {
      typingIndicator.remove();
      typingIndicator = null;
    }
  }

  // ---------- Send message to backend ----------
  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessage(text, true);
    userInput.value = '';
    showTyping();
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, role: currentRole })
      });
      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error || 'Server error');
      }
      const data = await response.json();
      hideTyping();
      addMessage(data.reply || 'No response', false);
    } catch (err) {
      hideTyping();
      addMessage('⚠️ ' + err.message, false);
    }
  }

  // ---------- Quick buttons ----------
  function initQuickButtons() {
    const container = document.getElementById('quickButtons');
    const questions = ['How to register to vote?', 'What is Model Code of Conduct?', 'How do I file nomination?', 'What ID do I need on polling day?'];
    container.innerHTML = '';
    questions.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = q;
      btn.onclick = () => {
        userInput.value = q;
        sendMessage(q);
      };
      container.appendChild(btn);
    });
  }

  // ---------- Election countdown (dynamic) ----------
  function updateCountdown() {
    const elections = [
      { name: 'General Election 2026', dateStr: '2026-11-03' },
      { name: 'State Assembly Elections', dateStr: '2026-08-15' }
    ];
    const today = new Date();
    const html = elections.map(e => {
      const target = new Date(e.dateStr);
      const diffDays = Math.ceil((target - today) / (1000 * 3600 * 24));
      let status = diffDays < 0 ? '✅ Completed' : diffDays === 0 ? '🔴 TODAY' : `⏳ in ${diffDays} days`;
      return `<div class="timeline-step">
        <div class="step-title">${e.name}</div>
        <div class="timeline-day">${status}</div>
        <div>${e.dateStr}</div>
      </div>`;
    }).join('');
    countdownDiv.innerHTML = html;
  }
  setInterval(updateCountdown, 86400000);
  updateCountdown();

  // ---------- Google Maps Embed (no key) ----------
  findPollingBtn.onclick = () => {
    const addr = addressInput.value.trim();
    if (!addr) return;
    mapContainer.innerHTML = `<iframe width="100%" height="200" style="border:0" loading="lazy" allowfullscreen src="https://maps.google.com/maps?q=${encodeURIComponent(addr)}&output=embed"></iframe>`;
  };

  // ---------- PDF Generator ----------
  downloadPdfBtn.onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica');
    doc.setFontSize(20);
    doc.text('Election Voter Guide', 20, 20);
    doc.setFontSize(12);
    doc.text('How to register to vote:', 20, 40);
    doc.text('1. Visit your local election commission website', 25, 50);
    doc.text('2. Fill out registration form (Form 6 in India)', 25, 60);
    doc.text('3. Submit proof of address and identity', 25, 70);
    doc.text('What to carry on polling day:', 20, 90);
    doc.text('- Voter ID card or any government-issued ID', 25, 100);
    doc.text('- Polling slip (if received)', 25, 110);
    doc.text('Model Code of Conduct:', 20, 130);
    doc.text('- No hate speeches, bribery, or misuse of power', 25, 140);
    doc.save('voter_guide.pdf');
  };

  // ---------- Speech Recognition ----------
  function initSpeech() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('Speech recognition not supported in this browser. Use Chrome or Edge.');
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = currentLang === 'en' ? 'en-US' : 'hi-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.start();
    speechBtn.textContent = '🎙️ Listening...';
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value = transcript;
      sendMessage(transcript);
      speechBtn.textContent = '🎤 Speak';
    };
    recognition.onerror = (event) => {
      console.error('Speech error:', event.error);
      speechBtn.textContent = '🎤 Speak';
      alert('Speech not recognized. Please try again.');
    };
    recognition.onend = () => {
      speechBtn.textContent = '🎤 Speak';
    };
  }

  if (speechBtn) speechBtn.onclick = initSpeech;

  // ---------- Dark Mode ----------
  function toggleDarkMode() {
    darkMode = !darkMode;
    if (darkMode) {
      document.body.classList.add('dark');
      darkModeBtn.textContent = '☀️ Light';
    } else {
      document.body.classList.remove('dark');
      darkModeBtn.textContent = '🌓 Dark';
    }
    localStorage.setItem('election_dark', darkMode ? 'dark' : 'light');
  }
  darkModeBtn.onclick = toggleDarkMode;

  // ---------- Multi‑language UI (static translations) ----------
  const translations = {
    en: {
      h1: '🗳️ Pro Election Assistant',
      findHeader: '📍 Find Polling Place',
      addressPlaceholder: 'Enter address (e.g., New Delhi, India)',
      findBtn: '🔍 Show Map',
      countdownHeader: '📅 Election Countdown & Guide',
      pdfBtn: '📘 Download Voter Guide (PDF)',
      roleLabel: 'I am a:',
      voter: 'Voter', candidate: 'Candidate', official: 'Election Official',
      chatHeader: '💬 AI Assistant (Groq Llama 3.3)',
      inputPlaceholder: 'Type your question...',
      sendBtn: 'Send',
      welcome: 'Hello! Select your role and ask me anything about elections.'
    },
    hi: {
      h1: '🗳️ प्रो चुनाव सहायक',
      findHeader: '📍 मतदान केंद्र खोजें',
      addressPlaceholder: 'पता दर्ज करें (जैसे, नई दिल्ली, भारत)',
      findBtn: '🔍 मानचित्र दिखाएँ',
      countdownHeader: '📅 चुनाव उल्टी गिनती और मार्गदर्शिका',
      pdfBtn: '📘 मतदाता गाइड डाउनलोड करें (PDF)',
      roleLabel: 'मैं हूँ:',
      voter: 'मतदाता', candidate: 'उम्मीदवार', official: 'चुनाव अधिकारी',
      chatHeader: '💬 AI सहायक (Groq Llama 3.3)',
      inputPlaceholder: 'अपना प्रश्न लिखें...',
      sendBtn: 'भेजें',
      welcome: 'नमस्ते! अपनी भूमिका चुनें और मुझसे चुनावों के बारे में कुछ भी पूछें।'
    }
  };

  function setLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    document.querySelector('h1').innerText = t.h1;
    document.querySelectorAll('.card-header')[0].innerText = t.findHeader;
    addressInput.placeholder = t.addressPlaceholder;
    findPollingBtn.innerText = t.findBtn;
    document.querySelectorAll('.card-header')[1].innerText = t.countdownHeader;
    downloadPdfBtn.innerText = t.pdfBtn;
    document.getElementById('roleLabel').innerText = t.roleLabel;
    roleSelect.options[0].text = t.voter;
    roleSelect.options[1].text = t.candidate;
    roleSelect.options[2].text = t.official;
    document.querySelectorAll('.card-header')[2].innerText = t.chatHeader;
    userInput.placeholder = t.inputPlaceholder;
    sendBtn.innerText = t.sendBtn;
    const firstMsg = document.querySelector('.message.assistant .bubble');
    if (firstMsg) firstMsg.innerText = t.welcome;
    langEnBtn.classList.toggle('active', lang === 'en');
    langHiBtn.classList.toggle('active', lang === 'hi');
    localStorage.setItem('election_lang', lang);
  }

  langEnBtn.onclick = () => setLanguage('en');
  langHiBtn.onclick = () => setLanguage('hi');

  // ---------- Role change ----------
  roleSelect.onchange = (e) => { currentRole = e.target.value; localStorage.setItem('election_role', currentRole); };

  // ---------- Load saved preferences ----------
  const savedLang = localStorage.getItem('election_lang');
  if (savedLang === 'hi') setLanguage('hi');
  else setLanguage('en');
  const savedRole = localStorage.getItem('election_role');
  if (savedRole && ['voter', 'candidate', 'official'].includes(savedRole)) {
    currentRole = savedRole;
    roleSelect.value = savedRole;
  }
  const savedDark = localStorage.getItem('election_dark');
  if (savedDark === 'dark') toggleDarkMode();

  // ---------- Event listeners ----------
  sendBtn.onclick = () => sendMessage(userInput.value);
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(userInput.value); });

  // ---------- Initialize ----------
  initQuickButtons();
  updateCountdown();
</script>
</body>
</html>
